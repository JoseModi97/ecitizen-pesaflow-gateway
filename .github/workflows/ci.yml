name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Run Test Suite & CLI Verification
      run: |
        node scripts/test.js
        node bin/ecitizen-pesaflow.js --help
        node bin/ecitizen-pesaflow.js test
